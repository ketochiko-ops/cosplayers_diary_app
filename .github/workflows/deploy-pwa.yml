name: Deploy PWA to Vercel

on:
  workflow_dispatch:
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: true

env:
  VERCEL_CLI_VERSION: 60.1.3
  VERCEL_ORG_ID: team_Rbg5zDuYk4PVnZooEJicDPqj
  VERCEL_PROJECT_ID: prj_7R31pxnvTFKBrZ42qqMqloppNLyb

jobs:
  deploy:
    name: Verify and deploy
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://cosplayers-diary-app.vercel.app
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build PWA
        run: >-
          flutter build web
          --release
          --pwa-strategy=none
          --base-href /
          --dart-define=GOOGLE_OAUTH_CLIENT_ID="$GOOGLE_OAUTH_CLIENT_ID"
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
      - run: node --check web/app_service_worker.js
      - run: node tool/verify_pwa.mjs build/web
      - run: node tool/prepare_vercel_output.mjs build/web
      - name: Stage Vercel Production deployment
        run: |
          set -euo pipefail
          : "${VERCEL_TOKEN:?Repository secret VERCEL_TOKEN is not set}"
          deployment_url="$(npx --yes --package "vercel@$VERCEL_CLI_VERSION" \
            vercel deploy --yes --prebuilt --prod --skip-domain)"
          case "$deployment_url" in
            https://*.vercel.app) ;;
            *) echo "Unexpected deployment URL: $deployment_url" >&2; exit 1 ;;
          esac
          echo "DEPLOYMENT_URL=$deployment_url" >> "$GITHUB_ENV"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Verify staged deployment
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 2 \
            "$DEPLOYMENT_URL/" -o /tmp/cosplayers-diary-index.html
          grep -Fq '<title>コスプレ日記</title>' \
            /tmp/cosplayers-diary-index.html
      - name: Promote verified deployment
        run: >-
          npx --yes --package "vercel@$VERCEL_CLI_VERSION"
          vercel promote "$DEPLOYMENT_URL" --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Verify production alias
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 2 \
            https://cosplayers-diary-app.vercel.app/ \
            -o /tmp/cosplayers-diary-production-index.html
          grep -Fq '<title>コスプレ日記</title>' \
            /tmp/cosplayers-diary-production-index.html
