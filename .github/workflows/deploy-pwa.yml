name: Deploy PWA to Vercel

on:
  workflow_dispatch:
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: true

env:
  VERCEL_CLI_VERSION: 60.1.3

jobs:
  deploy:
    name: Verify and deploy
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://cosplayers-diary-app.vercel.app
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build PWA
        run: >-
          flutter build web
          --release
          --pwa-strategy=none
          --base-href /
          --dart-define=GOOGLE_OAUTH_CLIENT_ID="$GOOGLE_OAUTH_CLIENT_ID"
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
      - run: node --check web/app_service_worker.js
      - run: node tool/verify_pwa.mjs build/web
      - run: node tool/prepare_vercel_output.mjs build/web
      - name: Deploy to Vercel Production
        run: |
          set -euo pipefail
          : "${VERCEL_TOKEN:?Repository secret VERCEL_TOKEN is not set}"
          : "${VERCEL_ORG_ID:?Repository secret VERCEL_ORG_ID is not set}"
          : "${VERCEL_PROJECT_ID:?Repository secret VERCEL_PROJECT_ID is not set}"
          npx --yes --package "vercel@$VERCEL_CLI_VERSION" \
            vercel deploy --yes --prebuilt --prod
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
